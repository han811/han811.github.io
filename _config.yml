# ---- build (all plugins below are in GitHub Pages' allow-list) ----
plugins: [jekyll-feed, jekyll-seo-tag, jekyll-sitemap, jekyll-redirect-from]
collections:
  projects: { output: true, permalink: /projects/:name/ }
defaults:
  - { scope: { path: "" },                  values: { layout: page, image: /assets/img/profile.jpg } }
  - { scope: { path: "", type: posts },     values: { layout: post, math: false } }
  - { scope: { path: "", type: projects },  values: { layout: project } }
  - { scope: { path: "assets" },            values: { sitemap: false } }
permalink: /blog/:year/:title/
excerpt_separator: <!--more-->
markdown: kramdown
kramdown:
  input: GFM
  math_engine: ~   # leave $$…$$ as-is; KaTeX renders it in the browser (see assets/js/main.js)
sass: { style: compressed }
exclude: [README.md, CLAUDE.md, compose.yaml]
