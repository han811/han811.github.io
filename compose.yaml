# Local preview only (GitHub Pages builds the real site by itself).
#   docker compose up   →  http://localhost:4000   (first run builds the image, a few minutes)
services:
  site:
    build:
      context: .
      dockerfile_inline: |
        FROM ruby:3.3-slim
        RUN apt-get update && apt-get install -y --no-install-recommends build-essential git \
         && rm -rf /var/lib/apt/lists/* && gem install github-pages --no-document
        ENV HOME=/tmp
        WORKDIR /site
    user: "${UID:-1000}:${GID:-1000}"
    volumes: [".:/site"]
    ports: ["4000:4000", "35729:35729"]   # 35729 = livereload
    command: jekyll serve --host 0.0.0.0 --livereload
